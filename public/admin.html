<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz ao Vivo · Administração</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar"><div class="inner">
  <a class="logo" href="/admin"><span class="dot"></span>Quiz ao Vivo</a>
  <div class="grow"></div>
  <a class="btn ghost small" href="/join" target="_blank">Entrar como participante</a>
  <button id="logout" class="ghost small hidden">Sair</button>
</div></header>

<main class="container">
  <section id="login" class="hidden" style="max-width:380px;margin:3rem auto">
    <form class="card stack" id="loginForm">
      <h2>Área do apresentador</h2>
      <div><label for="pw">Senha</label><input id="pw" type="password" autocomplete="current-password" required></div>
      <button class="primary big" style="width:100%;justify-content:center">Entrar</button>
      <p class="muted small" style="margin:0">A senha é definida pela variável de ambiente <code>ADMIN_PASSWORD</code>.</p>
    </form>
  </section>

  <section id="dash" class="hidden">
    <div id="liveWrap" class="hidden">
      <div class="section-title"><h2>Sessões ao vivo</h2></div>
      <div class="card"><table class="list"><thead><tr><th>Código</th><th>Quiz</th><th>Status</th><th>Participantes</th><th></th></tr></thead><tbody id="liveList"></tbody></table></div>
    </div>

    <div class="section-title"><h2>Meus quizzes</h2><button id="newQuiz" class="primary">+ Novo quiz</button></div>
    <div id="quizList" class="quiz-grid"></div>

    <div class="section-title"><h2>Resultados</h2></div>
    <div class="card"><table class="list"><thead><tr><th>Data</th><th>Quiz</th><th>Sala</th><th>Participantes</th><th>1º lugar</th><th>Exportar</th></tr></thead><tbody id="resultList"></tbody></table></div>
  </section>
</main>

<script src="/js/common.js"></script>
<script>
const PHASES = { lobby: 'Sala de espera', question: 'Pergunta', reveal: 'Resposta', leaderboard: 'Classificação', ended: 'Encerrado' };

async function boot() {
  if (!Auth.token) return showLogin();
  try { await api('/api/me'); } catch { return showLogin(); }
  const next = new URLSearchParams(location.search).get('next');
  if (next && next.startsWith('/')) return location.replace(next);
  $('#login').classList.add('hidden');
  $('#dash').classList.remove('hidden');
  $('#logout').classList.remove('hidden');
  load();
}
function showLogin() {
  $('#login').classList.remove('hidden');
  $('#dash').classList.add('hidden');
  $('#pw').focus();
}
$('#loginForm').onsubmit = async e => {
  e.preventDefault();
  try {
    const r = await api('/api/login', { method: 'POST', body: JSON.stringify({ password: $('#pw').value }) });
    Auth.token = r.token;
    boot();
  } catch (err) { toast(err.message, true); }
};
$('#logout').onclick = () => { Auth.token = null; location.href = '/admin'; };

async function load() {
  const [quizzes, live, results] = await Promise.all([api('/api/quizzes'), api('/api/sessions'), api('/api/results')]);

  $('#quizList').innerHTML = quizzes.length ? quizzes.map(q => `
    <div class="card quiz-card" data-id="${q.id}">
      <div class="cover" ${q.coverImage ? `style="background-image:url('${esc(q.coverImage)}')"` : ''}></div>
      <div class="body">
        <h3>${esc(q.title || 'Sem título')}</h3>
        <div class="muted small">${q.questions} pergunta${q.questions === 1 ? '' : 's'} · editado em ${fmtDate(q.updatedAt)}</div>
        ${q.errors.length ? `<div style="margin-top:.5rem"><span class="badge warn" title="${esc(q.errors.join('\n'))}">Incompleto: ${q.errors.length} pendência${q.errors.length > 1 ? 's' : ''}</span></div>` : '<div style="margin-top:.5rem"><span class="badge ok">Pronto</span></div>'}
      </div>
      <div class="actions">
        <button class="primary small" data-act="start" ${q.errors.length ? 'disabled title="Corrija as pendências no editor"' : ''}>▶ Iniciar</button>
        <a class="btn small" href="/admin/quiz/${q.id}">Editar</a>
        <a class="btn small" href="/admin/preview/${q.id}" target="_blank">Pré-visualizar</a>
        <button class="small ghost" data-act="dup" title="Duplicar">Duplicar</button>
        <button class="small ghost danger" data-act="del" title="Excluir">Excluir</button>
      </div>
    </div>`).join('') : '<div class="card empty" style="grid-column:1/-1">Nenhum quiz ainda. Clique em <b>+ Novo quiz</b> para começar.</div>';

  $('#liveWrap').classList.toggle('hidden', !live.length);
  $('#liveList').innerHTML = live.map(s => `<tr>
    <td><b style="letter-spacing:.08em">${esc(s.code)}</b></td><td>${esc(s.title)}</td>
    <td><span class="badge ${s.phase === 'ended' ? '' : 'ok'}">${PHASES[s.phase] || s.phase}</span></td>
    <td>${s.participants}</td>
    <td style="text-align:right"><a class="btn small primary" href="/host/${s.code}" target="_blank">Abrir painel</a></td></tr>`).join('');

  const t = encodeURIComponent(Auth.token);
  $('#resultList').innerHTML = results.length ? results.map(r => `<tr>
    <td>${fmtDate(r.endedAt)}</td><td>${esc(r.quizTitle)}</td><td>${esc(r.code)}</td><td>${r.participants}</td><td>${esc(r.winner || '—')}</td>
    <td class="row" style="gap:.3rem">
      <a class="btn small" href="/api/export/${r.sessionId}.xlsx?t=${t}">Excel</a>
      <a class="btn small" href="/api/export/${r.sessionId}.csv?t=${t}">CSV</a>
      <button class="small ghost danger" data-del-result="${r.sessionId}">Excluir</button>
    </td></tr>`).join('') : '<tr><td colspan="6" class="empty">Os resultados aparecem aqui quando um quiz ao vivo é encerrado.</td></tr>';
}

$('#newQuiz').onclick = async () => {
  const q = await api('/api/quizzes', { method: 'POST', body: JSON.stringify({ title: 'Novo quiz', questions: [] }) });
  location.href = '/admin/quiz/' + q.id;
};

document.addEventListener('click', async e => {
  const btn = e.target.closest('[data-act]');
  if (btn) {
    const id = btn.closest('[data-id]').dataset.id;
    const act = btn.dataset.act;
    if (act === 'start') {
      const win = window.open('about:blank', '_blank');
      try {
        const r = await api(`/api/quizzes/${id}/sessions`, { method: 'POST' });
        if (win) win.location = '/host/' + r.code; else location.href = '/host/' + r.code;
        setTimeout(load, 500);
      } catch (err) { if (win) win.close(); toast(err.data && err.data.errors ? err.data.errors[0] : err.message, true); }
    }
    if (act === 'dup') { await api(`/api/quizzes/${id}/duplicate`, { method: 'POST' }); toast('Quiz duplicado.'); load(); }
    if (act === 'del' && await confirmDialog('Excluir este quiz? Esta ação não pode ser desfeita. Os resultados já salvos continuam disponíveis.', 'Excluir', true)) {
      await api(`/api/quizzes/${id}`, { method: 'DELETE' }); toast('Quiz excluído.'); load();
    }
  }
  const del = e.target.closest('[data-del-result]');
  if (del && await confirmDialog('Excluir este resultado?', 'Excluir', true)) {
    await api(`/api/results/${del.dataset.delResult}`, { method: 'DELETE' }); load();
  }
});
setInterval(() => { if (!$('#dash').classList.contains('hidden') && !document.hidden) load().catch(() => {}); }, 10000);
boot();
</script>
</body>
</html>
